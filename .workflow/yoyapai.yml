version: '1.0'
name: yoyapai-daily
displayName: 每日 Clash 订阅抓取

triggers:
  schedule:
    # 每天 11:30（北京时间）。脚本总是抓取页面最新文章；11:30 通常已发布当天文章。
    # 如果希望每天 8:00 运行（此时通常拿到前一天的文章），改成 '0 0 8 * * ?'。
    # 如果构建记录显示的是 UTC 时间，11:30 对应 '0 30 3 * * ?'，8:00 对应 '0 0 0 * * ?'。
    - cron: '0 30 11 * * ?'

stages:
  - stage:
    name: fetch
    displayName: 抓取并更新订阅
    steps:
      - step: build@python
        name: fetch_yoyapai
        displayName: Python 构建
        pythonVersion: '3.9'
        commands:
          - python3 -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
          - PYTHONIOENCODING=utf-8 python3 yoyapai.py -o yoyapai.yaml
          - git config user.name "gitee-go"
          - git config user.email "gitee-go@noreply.gitee.com"
          - git add yoyapai.yaml
          - git diff --cached --quiet || git commit -m "chore: update yoyapai.yaml [skip ci]"
          - git config --global credential.helper store
          - printf 'https://oauth2:%s@gitee.com\n' "$YOYAPAI_TOKEN" > ~/.git-credentials
          - chmod 600 ~/.git-credentials
          - git remote set-url origin https://gitee.com/qingshan1206/yoyapai.git
          - git push origin HEAD:master
