name: yoyapai-daily

on:
  schedule:
    # GitHub Actions 使用 UTC：03:30 UTC = 11:30 北京时间
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yoyapai-daily
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Fetch latest subscription
        run: python yoyapai.py -o yoyapai.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yoyapai.yaml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update yoyapai.yaml"
            git push
          fi
